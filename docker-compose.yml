services:
  mysql:
    image: mysql:8.4
    container_name: kata-spring-hibernate
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springDB
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mysql-data: